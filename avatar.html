<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owoxy - Avatar Editor</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="home.html"><i></i>OWOXY</a>
    <nav>
      <a href="home.html">Home</a>
      <a href="#" data-soon>Games</a>
      <a href="#" data-soon>Avatar Shop</a>
      <a href="#" data-soon>Create</a>
    </nav>
    <div class="search"><input id="search" placeholder="Search" aria-label="Search"></div>
    <div class="right">
      <button class="icon-btn" data-soon data-i="list" aria-label="Menu"></button>
      <button class="icon-btn" data-soon data-i="chat" aria-label="Messages"></button>
      <span class="balance" id="balance-wrap"><span data-i="coin"></span><span id="balance">0</span></span>
      <div class="gear-wrap">
        <button class="icon-btn" id="gear" data-i="gear" aria-label="Settings"></button>
        <div class="gear-menu" id="gear-menu">
          <button data-soon>Settings</button>
          <button id="logout">Log Out</button>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="user" id="side-user"></div>
      <a href="home.html"><span data-i="home"></span>Home</a>
      <a href="#" data-soon><span data-i="profile"></span>Profile</a>
      <a class="active" href="avatar.html"><span data-i="avatar"></span>Avatar</a>
      <a href="#" data-soon><span data-i="inventory"></span>Inventory</a>
      <a href="#" data-soon><span data-i="groups"></span>Groups</a>
      <a href="#" data-soon><span data-i="premium"></span>Premium</a>
      <a href="#" data-soon><span data-i="money"></span>Money</a>
      <a href="#" data-soon><span data-i="feed"></span>My Feed</a>
      <a href="#" data-soon><span data-i="blog"></span>Blog</a>
      <a href="#" data-soon><span data-i="store"></span>Official Store</a>
      <a href="#" data-soon><span data-i="gift"></span>Gift Cards</a>
      <div class="section-title">Events</div>
    </aside>

    <main class="main wide">
      <div class="editor-head">
        <h1>Avatar Editor</h1>
        <div class="get-more"><span>Explore the catalog to find more clothes!</span><button class="btn-white" id="get-more" type="button">Get More</button></div>
      </div>

      <div class="editor">
        <section class="preview-card">
          <canvas id="preview" width="300" height="400"></canvas>
          <button class="toggle-2d" id="toggle-2d" type="button">2D</button>
        </section>

        <section class="picker">
          <div class="tabs" id="tabs">
            <button data-tab="Recent">Recent ▾</button>
            <button data-tab="Clothing">Clothing ▾</button>
            <button data-tab="Body">Body ▾</button>
            <button data-tab="Animations">Animations ▾</button>
            <button data-tab="Costumes">Costumes ▾</button>
          </div>
          <div class="crumb" id="crumb"></div>
          <div class="pills" id="pills"></div>
          <div class="grid" id="grid"></div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="js/common.js"></script>
  <script type="module" src="js/avatar-page.js"></script>
</body>
</html>
