<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owoxy - Avatar Editor</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="topbar-slot"></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar-slot"></aside>
    <main class="main wide" id="main">
      <div class="editor-head">
        <h1>Avatar Editor</h1>
        <div class="get-more"><span>Explore the catalog to find more clothes!</span><button class="btn-white" id="get-more" type="button">Get More</button></div>
      </div>

      <div class="editor">
        <section class="preview-card">
          <canvas id="preview" width="300" height="400"></canvas>
          <button class="toggle-2d" id="toggle-2d" type="button">2D</button>
        </section>

        <section class="picker">
          <div class="tabs" id="tabs">
            <button data-tab="Wearing">Currently Wearing</button>
            <button data-tab="Clothing">Clothing</button>
            <button data-tab="Accessories">Accessories</button>
            <button data-tab="Body">Body</button>
          </div>
          <div class="crumb" id="crumb"></div>
          <div class="pills" id="pills"></div>
          <div class="grid" id="grid"></div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="js/common.js"></script>
  <script type="module" src="js/avatar-page.js"></script>
</body>
</html>
