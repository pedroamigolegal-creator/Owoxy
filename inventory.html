<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owoxy - Inventory</title>
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="topbar-slot"></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar-slot"></aside>
    <main class="main wide" id="main">
      <h1 class="page-title">Inventory</h1>
      <div class="tabs2 left" id="inv-tabs">
        <button class="on" data-k="">All</button>
        <button data-k="shirt">Shirts</button>
        <button data-k="pants">Pants</button>
        <button data-k="accessory">Accessories</button>
        <button data-k="facedecal">Faces</button>
      </div>
      <p class="muted">Everything you buy or create shows up here automatically. Click an item to wear it.</p>
      <div class="cat-grid" id="grid"></div>
    </main>
  </div>
  <script type="module" src="js/common.js"></script>
  <script type="module" src="js/inventory.js"></script>
</body>
</html>
