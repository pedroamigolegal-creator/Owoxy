<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owoxy - Reports</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="topbar-slot"></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar-slot"></aside>
    <main class="main wide" id="main">
      <h1 class="page-title">Reports</h1>
      <p class="muted">Reports sent by players from inside the games. Only the Owoxy account can see this page.</p>
      <form id="rep-filter" class="row-gap"><select id="rep-status" aria-label="Status"><option value="open">Open</option><option value="closed">Closed</option><option value="all">All</option></select><a class="btn-gray" href="accounts.html" style="padding:6px 12px;border-radius:4px">Created Accounts</a></form>
      <p id="rep-total" class="muted"></p>
      <div class="card" style="overflow-x:auto"><table class="acc-table"><thead><tr><th>Date</th><th>Reported</th><th>By</th><th>Reason</th><th>Details</th><th>Where</th><th>Actions</th></tr></thead><tbody id="rep-body"></tbody></table></div>
    </main>
  </div>
  <script type="module" src="js/reports.js"></script>
</body>
</html>
