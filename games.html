<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owoxy - Games</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="topbar-slot"></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar-slot"></aside>
    <main class="main">
      <h1 class="page-title">Games</h1>
      <div class="games-grid">
        <a class="game-card" href="game.html">
          <div class="game-thumb"><img src="assets/games/talk-to-others.svg" alt="" width="512" height="512"></div>
          <h3>Talk To Others</h3>
          <p class="by">By Owoxy <span id="badge"></span></p>
          <p class="meta">Chat and hang out in a small town &middot; up to 100 players</p>
        </a>
        <a class="game-card" href="game.html?g=nds">
          <div class="game-thumb"><img src="assets/games/natural-disaster-survival.svg" alt="" width="512" height="512"></div>
          <h3>Natural Disaster Survival</h3>
          <p class="by">By Owoxy <span id="badge2"></span></p>
          <p class="meta">Survive 8 different disasters &middot; up to 100 players</p>
        </a>
      </div>
    </main>
  </div>
  <script type="module" src="js/games.js"></script>
</body>
</html>
